name: Android auto build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: android-auto-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build Zgram Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifact
          cp TMessagesProj_App/build/outputs/apk/afat/debug/app.apk artifact/Zgram-Android-Debug.apk
          test -f artifact/Zgram-Android-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zgram Android Debug
          path: artifact/Zgram-Android-Debug.apk
          if-no-files-found: error
          retention-days: 14